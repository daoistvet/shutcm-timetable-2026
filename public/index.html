<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUTCM 国际学生课程表 · International Student Timetable</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238c1f28'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='serif'%3E医%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">医</div>
      <div>
        <h1 data-i18n="siteTitle">国际学生课程表 · 2026–2027 第一学期</h1>
        <p class="semester-line" id="semesterLine"></p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="week-badge" id="weekBadge" hidden></div>
      <button class="lang-toggle" id="langToggle" title="Switch language">EN</button>
    </div>
  </div>
</header>

<div class="alert" id="noticeBar" hidden></div>

<nav class="year-tabs" id="yearTabs" aria-label="Intake year"></nav>

<main class="container">
  <section class="group-bar" id="groupBar" hidden>
    <div class="group-pills" id="groupPills"></div>
    <div class="view-tabs" id="viewTabs" role="tablist"></div>
  </section>

  <section id="view-week" class="view" hidden>
    <div class="toolbar">
      <div class="toolbar-note" id="weekToolbarNote"></div>
      <label class="switch"><input type="checkbox" id="thisWeekOnly"><span data-i18n="thisWeekOnly">只看本周上课课程</span></label>
      <button class="btn ghost" id="printBtn" data-i18n="print">打印 / Print</button>
    </div>
    <div class="grid-wrap"><div class="weekgrid" id="weekGrid"></div></div>
    <div class="legend" id="weekLegend"></div>
  </section>

  <section id="view-plan" class="view" hidden>
    <div class="plan-columns">
      <div class="plan-main" id="planMain"></div>
      <aside class="plan-side" id="planSide"></aside>
    </div>
  </section>

  <section id="view-courses" class="view" hidden>
    <div class="toolbar wrap">
      <div class="chip-row" id="courseScope"></div>
      <input type="search" id="courseSearch" data-i18n-ph="searchPh" placeholder="搜索课程 / 教师 / 教室…">
    </div>
    <div class="table-wrap"><table class="course-table" id="courseTable"></table></div>
  </section>

  <section id="view-roadmap" class="view" hidden>
    <div id="roadmapBody"></div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div id="legendNotes"></div>
    <p class="fineprint" id="fineprint"></p>
  </div>
</footer>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
